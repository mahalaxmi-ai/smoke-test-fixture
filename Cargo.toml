[package]
name = "configstitch"
version = "0.3.0"
edition = "2021"
rust-version = "1.75.0"
description = "Merge layered configuration files into a single unified config"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
